</head>

        // 2. Ensure localStorage always has valid products with images & vegetables
        function syncMasterProducts() {
            let stored = JSON.parse(localStorage.getItem('products') || '[]');
            // Re-sync if empty or if missing vegetables/broken images
            const needsSync = stored.length === 0 || !stored.some(p => p.category === 'Vegetables') || stored.some(p => p.image && p.image.startsWith('images/'));
            if (needsSync) {
                localStorage.setItem('products', JSON.stringify(MASTER_PRODUCTS));
            }
        }
        syncMasterProducts();

        // 3. Render Modern Home with Fixed Portal Demands
        function renderModernHome() {
            let productsList = JSON.parse(localStorage.getItem('products') || '[]').slice();
            if (productsList.length === 0) productsList = MASTER_PRODUCTS.slice();

            const categories = {};
            productsList.forEach(product => {
                let cat = product.category || 'Other';
                if (cat.toLowerCase() === 'produce') cat = 'Fruits';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(product);
            });

            // Ensure Fruits, Vegetables, Crops order
            const orderedCats = ['Fruits', 'Vegetables', 'Crops'];
            Object.keys(categories).forEach(cat => {
                if (!orderedCats.includes(cat)) orderedCats.push(cat);
            });

            let html = '';
            orderedCats.forEach(cat => {
                if (!categories[cat] || categories[cat].length === 0) return;
                html += `<div class='section-title'><i class="fa fa-leaf"></i> ${cat}</div>`;
                html += `<div class='carousel'>`;
                
                categories[cat].forEach(product => {
                    const reqQty = Number(product.requiredQuantity) || Number(product.quantity) || 1;
                    const reqUnit = product.requiredUnit || product.unit || 'kg';
                    const unitRate = Number(product.price) || 0;
                    const totalBatchValue = unitRate * reqQty;

                    const formattedRate = unitRate.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    const formattedTotal = totalBatchValue.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    html += `<div class='product-card'>
                        <img src='${product.image}' alt='${product.name}' onerror="this.src='https://placehold.co/120x120/e8f5e9/2e7d32?text=${encodeURIComponent(product.name)}'">
                        <div class='name'>${product.name}</div>
                        
                        <div class='price' id='price-${product.id}'>
                            ₹${formattedRate} <span style="font-size: 0.8rem; font-weight: normal; color: #666;">/ ${reqUnit}</span>
                        </div>
                        
                        <div class='desc'>${product.description || ''}</div>
                        
                        <!-- Fixed Requirement Badge set by Admin -->
                        <div class='quantity-control fixed-requirement' title='Procurement demand fixed by portal'>
                            <span class='qty-label'>Required:</span>
                            <span class='qty-badge'>${reqQty} ${reqUnit}</span>
                        </div>

                        <!-- Auto-calculated Batch Value -->
                        <div class='total-payout-badge'>
                            Total Value: ₹${formattedTotal}
                        </div>

                        <div class='card-actions'>
                            <button onclick='addToCart(${JSON.stringify(product).replace(/'/g, "\\'")}, ${reqQty})'>
                                <i class="fa fa-cart-plus"></i> Add to Cart
                            </button>
                            <button onclick="window.location.href='sell-product.html'" title="Open Farmer Portal">
                                <i class="fa fa-plus-circle"></i>
                            </button>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            });
            document.getElementById('main-sections').innerHTML = html;
        }

        // 4. Add to Cart: Transfers the current fixed demand into sell-product.html
        function addToCart(product, quantity) {
            const reqQty = Number(quantity) || Number(product.requiredQuantity) || Number(product.quantity) || 1;
            const reqUnit = product.requiredUnit || product.unit || (product.unit && product.unit.includes('ton') ? 'ton' : 'kg');
            const unitPrice = Number(product.price) || 0;

            const cartItem = {
                id: product.id || product.name,
                name: product.name,
                category: product.category || 'Produce',
                price: unitPrice,
                quantity: reqQty,              // Fixed to required quantity
                requiredQuantity: reqQty,      // Preserved requirement
                requiredUnit: reqUnit,
                unit: reqUnit,
                totalPrice: unitPrice * reqQty,
                image: product.image
            };

            const selectedProducts = JSON.parse(localStorage.getItem('sellSelectedProducts')) || [];
            const existingIndex = selectedProducts.findIndex(item => (item.id || item.name) === cartItem.id);
            
            if (existingIndex > -1) {
                selectedProducts[existingIndex] = cartItem;
            } else {
                selectedProducts.push(cartItem);
            }

            localStorage.setItem('sellSelectedProducts', JSON.stringify(selectedProducts));
            localStorage.setItem('sellSelectedProduct', JSON.stringify(cartItem));
            
            window.location.href = 'sell-product.html';
        }

        function scrollToProducts() {
            const firstSection = document.querySelector('.section-title');
            if (firstSection) firstSection.scrollIntoView({ behavior: 'smooth' });
        }

        function updateAuthStatus() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const authButtons = document.getElementById('auth-buttons');

                    <div style="display: flex; align-items: center; gap: 0.5rem; color: #2e7d32; font-weight: 600;">
                        <i class="fa fa-user"></i>
                        <span>${user.firstName || 'Farmer'}</span>
                    </div>
                    <button class="logout-btn" onclick="localStorage.removeItem('currentUser'); window.location.reload();">Logout</button>
                `;
            }
        }

        updateAuthStatus();

        window.addEventListener('storage', (e) => {
            if (e.key === 'products') renderModernHome();
        });
        window.addEventListener('focus', renderModernHome);
    </script>
</body>
